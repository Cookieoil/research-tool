name: Security regression tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  NO_COLOR: "1"
  TERM: dumb
  PYTHONUNBUFFERED: "1"

jobs:
  security:
    name: Security suite (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run security regression suite
        run: python tests/test_security.py

      - name: Run offline regression suites
        run: |
          python tests/test_smoke.py
          python tests/test_privacy.py
          python tests/test_github.py
          python tests/test_papers.py
          python tests/test_cross_border.py

      - name: Run full pytest suite
        run: python -m pytest tests/ -q

      - name: Dependency audit (pip-audit)
        run: |
          python -m pip install --quiet pip-audit
          python -m pip_audit --strict

      - name: Static analysis (bandit)
        run: |
          python -m pip install --quiet bandit
          python -m bandit -q -r research_tool -ll
